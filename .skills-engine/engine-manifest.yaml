schema_version: "1.0"
engine_id: proposal-skills
display_name: Proposal Skills
contract_version: "1.0"
version: "1.1.0"
router:
  path: AGENTS.md
skills:
  discovery_glob: skills/**/SKILL.md
validation:
  - id: release-gate
    command: >-
      git diff --check
    working_directory: .
    platforms:
      - windows
      - linux
      - macos
agent_integration:
  supported_modes: [full, sequential, read_only, not_assessed]
  local_context_files: [AGENTS.md, .skills-engine/AGENTS-INTEGRATION.md]
  mcp_safe_tools: [discover_engine, read_router, read_skill, validate_documented_checks]
  approval_required_for: [write_files, pull, update, publish, external_message]
  forbidden_operations: [git_reset, git_clean, force_push, arbitrary_shell, broad_delete]
  fork_behavior: inspect_local_router_without_inventing_validators
source_of_truth:
  router: AGENTS.md
  skills: skills/**/SKILL.md
  references: references/**
invariants:
  - id: british-english
    phrase: "Use British English and East African professional tone for proposal work unless the active skill says otherwise."
  - id: book-extraction-ban
    phrase: "Book extractions and book summaries must never be stored in this repository, in any folder or under any name"
  - id: not-assessed
    phrase: "Missing source, compliance, financial, design, render, reviewer, or authority evidence is `NOT ASSESSED`, never a pass."
